# Hitch-fix guard. NOTE: the brief for this gate assumed 'not below 4s'. On main the
# value is 1.5 s: issue #67 (commit 08752db) deliberately LOWERED it from 4 s so a
# hung win-capture is detected sooner (visible freeze ~10 s -> ~5 s). The guard
# therefore pins the CURRENT value in both directions (min=max) and refuses silent
# drift either way. It is NOT the 4 s the old docs implied.
[[const]]
id = "frame-stale-bridge"
file = "crates/host/src/capture/bridge.rs"
item = "FRAME_STALE_AFTER"
min = 4000
max = 4000
why = "INTENTIONAL CHANGE (PR #107, c1b4187): 1.5s -> 4s. A 1.5s stale rule force-respawned the capture on ordinary hitches (viewers saw ~5s paused) and livelocked cold starts; 4s plus a 10s first-frame grace removes that while a truly hung capture is still dropped. Lowering it re-introduces the false respawns."

