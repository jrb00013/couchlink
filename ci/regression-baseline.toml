# ---------------------------------------------------------------- required code shapes
# `pattern` is a Python regex. count = minimum number of matches.
[[snippet]]
id = "ladder-fps-floor-45"
file = "crates/host/src/link_gov.rs"
pattern = '\.max\(45\)'
count = 2
why = "AUDIT: fps floor never below 45 (sub-45 = death spiral); both ladders"

[[snippet]]
id = "ladder-holds-bitrate"
file = "crates/host/src/link_gov.rs"
pattern = 'bitrate_kbps:\s*baseline\.bitrate_kbps,'
count = 1
why = "AUDIT: fps-only ladder holds baseline bitrate (never step bits; no 1250 floor)"

[[snippet]]
id = "ladder-congested-cuts"
file = "crates/host/src/link_gov.rs"
pattern = '\[80u32,\s*60,\s*40\]'
count = 1
why = "bitrate cuts exist ONLY in the rtp_congested tier; do not add deeper rungs"

[[snippet]]
id = "rtcp-pli-ignored-in-hybrid"
file = "crates/host/src/webrtc_peer.rs"
pattern = 'if send_rtp && send_dc \{\s*continue;\s*\}'
count = 1
why = "AUDIT: ignore Chrome RTCP PLI in hybrid dual (shared-IDR black cycle)"

[[snippet]]
id = "no-fec-while-rtp-live"
file = "crates/host/src/webrtc_peer.rs"
pattern = 'self\.fec_enabled && path == PATH_WEBCODECS && !send_rtp'
count = 1
why = "AUDIT: no FEC while RTP is live"

[[snippet]]
id = "bootstrap-dc-pli-coalesce"
file = "crates/host/src/webrtc_peer.rs"
pattern = 'KEYFRAME_COALESCE_DUAL_MS'
count = 3
why = "AUDIT: one bootstrap DC PLI, long coalesce (>=3s) so no IDR storm"

# Forbidden: patterns that must NOT appear.
[[forbidden]]
id = "no-fec-alongside-rtp"
file = "crates/host/src/webrtc_peer.rs"
pattern = 'fec_enabled\s*&&\s*send_rtp'
why = "AUDIT do-not #2: never FEC alongside live RTP"

