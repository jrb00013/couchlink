name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev pkg-config
      # host-panel is an egui desktop binary (extra GUI libs); keep CI lean.
      - run: cargo test --workspace --exclude couchlink-host-panel
      - name: web unit tests
        working-directory: web
        run: |
          npm ci
          npm test -- --run src/splitSeat.test.ts src/splitDetector.test.ts src/splitNonRegression.test.ts
