# Applied on top of the user's RPCS3 config when installing the BO2 pack.
#
# Feel vs crash is solved in RPCS3 *code* (fix/vk-cb-chain-wait): wait/reclaim
# free Vulkan CBs instead of reusing a still-pending one (BO2 present freeze).
#
# Until that build is staged as the active rpcs3.exe:
#   Multithreaded RSX: false, Frame limit: Auto  (crash-safe, display-paced)
# After CB-wait is staged, flip Multithreaded RSX back to true for last-night feel
# (backup had MT RSX true + Frame Auto).
Core:
  SPU Block Size: Safe
  Accurate SPU DMA: true
  PPU Reservation Priority Over SPUs: true
  Accurate Cache Line Stores: true
  Accurate RSX reservation access: true
  Disable SPU GETLLAR Spin Optimization: true
  SPU Wake-Up Delay: 20
  Max SPURS Threads: 4
Video:
  Multithreaded RSX: false
  RSX FIFO Fetch Accuracy: Atomic
  Accurate ZCULL stats: false
  Relaxed ZCULL Sync: true
  Frame limit: Auto
  Resolution: 1280x720
  Resolution Scale: 100
  Exclusive Fullscreen Mode: Disable
Miscellaneous:
  Start games in fullscreen mode: false
