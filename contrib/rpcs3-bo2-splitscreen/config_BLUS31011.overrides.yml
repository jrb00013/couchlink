# Applied on top of the user's RPCS3 config when installing the BO2 pack.
#
# KEEP Multithreaded RSX: false — even with the couchlink-play fork
# (SPURS + HID + Vulkan CB reclaim). CB-wait stops *present death*
# (`CB chain has run out of free entries`); it does NOT stop BO2's
# SPURS wait-loop softlock. That shows up as a stuck FPS counter and
# runaway `sys_timer_usleep` — often when opening the in-game settings
# menu under MT RSX. Live softlocked 2026-09-30 with MT RSX on + CB-wait.
#
# Stage couchlink-play anyway (`switch-rpcs3.cmd couchlink-play`) so a
# future MT RSX experiment doesn't present-freeze; leave MT off here for
# playable nights. Frame limit Auto either way.
Core:
  SPU Block Size: Safe
  Accurate SPU DMA: true
  PPU Reservation Priority Over SPUs: true
  Accurate Cache Line Stores: true
  Accurate RSX reservation access: true
  # Spin optimization ON (default). 2026-10-01 BO2 stall dump: 6 SPURS kernels pegged ~99% while the PPU
  # 'Secondary' thread starved in a lwarx/stwcx. retry loop; the pack had this OFF without documented evidence.
  Disable SPU GETLLAR Spin Optimization: false
  SPU Wake-Up Delay: 20
  Max SPURS Threads: 4
Video:
  Multithreaded RSX: false
  RSX FIFO Fetch Accuracy: Atomic
  Accurate ZCULL stats: false
  Relaxed ZCULL Sync: true
  Frame limit: Auto
  Resolution: 1280x720
  Resolution Scale: 100
  Exclusive Fullscreen Mode: Disable
Miscellaneous:
  Start games in fullscreen mode: false
