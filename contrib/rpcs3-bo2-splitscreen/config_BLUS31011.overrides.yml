# Applied on top of the user's RPCS3 config when installing the BO2 pack.
# Locksmith balance: kill the hang-detect watchdog in BLUS31011_patch.yml,
# stay under the CB-ring cliff here WITHOUT killing last-night feel.
#
# Crash recipe was Multithreaded RSX ON + uncapped flooding Vulkan CBs.
# Keep MT RSX off (the amplifier). Leave Frame limit Off so sim/present
# can run like last night; if CB freeze returns, set Frame limit: 60 until
# the vk-cb-chain-wait build is staged.
Core:
  SPU Block Size: Safe
  Accurate SPU DMA: true
  PPU Reservation Priority Over SPUs: true
  Accurate Cache Line Stores: true
  Accurate RSX reservation access: true
  Disable SPU GETLLAR Spin Optimization: true
  SPU Wake-Up Delay: 20
  Max SPURS Threads: 4
Video:
  Multithreaded RSX: false
  RSX FIFO Fetch Accuracy: Atomic
  Accurate ZCULL stats: false
  Relaxed ZCULL Sync: true
  # Off = last-night feel. MT RSX stays false so we don't reopen the CB flood.
  Frame limit: Off
  Resolution: 1280x720
  Resolution Scale: 100
  Exclusive Fullscreen Mode: Disable
Miscellaneous:
  Start games in fullscreen mode: false
