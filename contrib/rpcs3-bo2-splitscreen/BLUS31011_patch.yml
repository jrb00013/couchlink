# Live 2026-10-12: this EBOOT hashes as PPU-1229303f… — the old
# PPU-fa8ffe9a… entries never matched, so hang-detect suicide still ran.
PPU-1229303f45fc13ff13842852a5ca50afc183a94b:
  "BO2 split-screen: disable hang-detect watchdog (couchlink)":
    Games:
      "Call of Duty: Black Ops II":
        BLUS31011: [ 01.00 ]
    Author: "couchlink"
    Notes: |
      Hang-detect thread prints "Hang detected." then deliberately
      `li r3,0x17; stw r4,0(r3)` — Fatal AV, emu freeze (live 2026-10-12 01:33).
      Addresses from that crash dump (CIA 0x2fb984 / 0x2fb9cc).
      Does NOT fix the underlying stall; removes the suicide so play23 can recover.
      Patch A: force watchdog-enabled flag read to 0 (skip hang path).
      Patch B: NOP the intentional crash store.
    Patch Version: 1.2
    Patch:
      # 002fb984  lbz r3,-0x3b54(r3)  ->  li r3,0
      - [ be32, 0x002fb984, 0x38600000 ]
      # 002fb9cc  stw r4,0(r3)        ->  nop
      - [ be32, 0x002fb9cc, 0x60000000 ]

  "BO2 softlock: force SPURS wait complete then exit (couchlink)":
    Games:
      "Call of Duty: Black Ops II":
        BLUS31011: [ 01.00 ]
    Author: "couchlink"
    Notes: |
      DISABLED by default. Kept for archaeology. Softlock force-complete causes
      GUEST_STALL — leave Enabled: false in patch_config.yml.
    Patch Version: 2.0
    Patch:
      - [ be32, 0x0073d7a8, 0xfbfe0000 ]
      - [ be32, 0x0073d7ac, 0x4800000c ]
      - [ be32, 0x0073d7b0, 0x60000000 ]
      - [ be32, 0x0073d7b4, 0x60000000 ]

