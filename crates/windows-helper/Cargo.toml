[package]
name = "couchlink-windows-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows privileged helper service for couchlink (firewall/portproxy/UPnP without UAC on run)"
publish = false

[[bin]]
name = "couchlink-helper"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
