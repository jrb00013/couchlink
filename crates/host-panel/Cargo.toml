[package]
name = "couchlink-host-panel"
version.workspace = true
edition.workspace = true
description = "Native egui host control panel: stack scripts, join URL, split-seat isolation"

[[bin]]
name = "couchlink-host-panel"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
ureq = { version = "2", default-features = true }
arboard = "3"
