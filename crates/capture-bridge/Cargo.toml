[package]
name = "couchlink-capture-bridge"
version.workspace = true
edition.workspace = true
description = "Windows desktop capture bridge + CLFR wire protocol for WSL hosts"

[lib]
path = "src/lib.rs"

[[bin]]
name = "couchlink-win-capture"
path = "src/bin/win_capture.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.0"
# Must track the version windows-capture links, so HWNDs are the same type.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
