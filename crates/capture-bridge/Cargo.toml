[package]
name = "couchlink-capture-bridge"
version.workspace = true
edition.workspace = true
description = "Windows desktop capture bridge + CLFR wire protocol for WSL hosts"

[lib]
path = "src/lib.rs"

[[bin]]
name = "couchlink-win-capture"
path = "src/bin/win_capture.rs"

[[bin]]
name = "couchlink-capture-bridge-linux"
path = "src/bin/linux_record.rs"
required-features = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
# Reuses the same x11rb crate crates/host already links (see
# crates/host/src/capture/cursor_x11.rs) so this only needs one real X11
# connection implementation across the workspace.
x11rb = { version = "0.13", default-features = true, features = ["shm"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.0"
# Must track the version windows-capture links, so HWNDs are the same type.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinSock",
    "Win32_System_Hypervisor",
] }
# The `#[implement]` macro's expansion refers to `windows_core` by its crate
# name directly (not via `windows::core`), so it must be a real dependency —
# not just reachable through the `windows` facade crate.
windows-core = "0.62"
# WASAPI loopback capture encodes straight to Opus so the wire only ever
# carries compressed audio (crates/host expects Opus RTP either way — see
# crates/host/src/webrtc_peer.rs MIME_TYPE_OPUS). Same crate/version family
# the native client already uses for playback (crates/client/Cargo.toml).
opus = "0.3"
