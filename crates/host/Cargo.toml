[package]
name = "couchlink-host"
version.workspace = true
edition.workspace = true
description = "Couchlink host — HD capture, WebRTC stream, virtual BT pad inject"

[[bin]]
name = "couchlink-host"
path = "src/main.rs"

[dependencies]
couchlink-proto = { workspace = true }
couchlink-pad = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures-util = "0.3"
webrtc = "0.17"
rtp = "0.17"
interceptor = "0.17"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
scrap = "0.5"
openh264 = "0.6"
couchlink-capture-bridge = { path = "../capture-bridge" }
rand = "0.8"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = "0.5"
# Non-blocking AF_VSOCK connect so a missing win-capture cannot wedge the host
# event loop (friends stuck on "Waiting for host offer").
nix = { version = "0.29", default-features = false, features = ["socket", "poll"] }
x11rb = { version = "0.13", default-features = true, features = ["xfixes", "randr"] }
